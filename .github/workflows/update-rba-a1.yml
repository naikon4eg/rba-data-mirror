name: Update RBA A1 mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'

permissions:
  contents: write

concurrency:
  group: update-rba-a1
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official RBA A1 CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data tmp

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36' \
            --header 'Accept: text/csv,application/octet-stream;q=0.9,*/*;q=0.8' \
            --header 'Referer: https://www.rba.gov.au/statistics/tables/' \
            'https://www.rba.gov.au/statistics/tables/csv/a1-data.csv' \
            --output tmp/a1-data.csv

      - name: Validate downloaded file
        shell: bash
        run: |
          set -euo pipefail

          test -s tmp/a1-data.csv
          test "$(wc -c < tmp/a1-data.csv)" -gt 20000
          grep -q 'A1 RESERVE BANK OF AUSTRALIA - BALANCE SHEET' tmp/a1-data.csv
          grep -q 'Series ID' tmp/a1-data.csv
          grep -q 'ARBAATAW' tmp/a1-data.csv

          if grep -qi 'Access Denied' tmp/a1-data.csv; then
            echo 'RBA returned an Access Denied page instead of CSV.' >&2
            exit 1
          fi

      - name: Publish unchanged mirror file
        shell: bash
        run: |
          set -euo pipefail
          mv tmp/a1-data.csv data/a1-data.csv

      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/a1-data.csv; then
            echo 'No RBA data change.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/a1-data.csv
          git commit -m 'Update official RBA A1 CSV mirror'
          git push
